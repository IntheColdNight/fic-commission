<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>In the Cold Night · คอมมิชชั่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: soft, sleepy, gentle — a shy writer's commission desk
   IDEA: a little order slip handed over on a cold blue night
   PICTURE: the chibi mascot under falling snow, with the live price tag beside the form
   COLOUR and TYPE: periwinkle hair blue, icy sky, dino-green accent, sweater cream; Mali + Noto Sans Thai
   LAYOUT: hero band, then form column + sticky price slip; stacks on phones with bottom total bar */
:root{color-scheme:light dark;
--bg:light-dark(#eef3ff,#121733);--card:light-dark(#ffffff,#1c2350);--ink:light-dark(#23285a,#e8ecff);
--soft:light-dark(#5d6496,#a9b2e6);--line:light-dark(#d6def7,#323b78);--blue:light-dark(#6f7fd8,#8f9cf0);
--ice:light-dark(#d4e6ff,#27306a);--green:#93c95d;--greenD:light-dark(#4f7d24,#b6e28a);--cream:light-dark(#fbf6ea,#2a2f5c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.big{font-family:Mali,"Noto Sans Thai",sans-serif}
.hero{position:relative;overflow:hidden;padding-top:64px!important;background:linear-gradient(180deg,#5867c4 0%,#7f8fdc 55%,#b9cdfb 100%);color:#fff;padding:clamp(24px,4vw,48px) max(5vw,16px) 0}
.hero-in{max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:end;gap:24px}
.hero h1{font-size:clamp(36px,6vw,58px);line-height:1.05;margin:0 0 10px;text-wrap:balance;text-shadow:0 3px 0 rgba(40,46,120,.25)}
.hero p{margin:0 0 28px;font-size:17px;max-width:34em;opacity:.95}
.hero img{width:min(100%,340px);justify-self:center;display:block;filter:drop-shadow(0 10px 18px rgba(30,35,110,.35));margin-bottom:-6px}
.tag{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 12px;font-size:14px;margin-bottom:12px}
.snow{position:absolute;inset:0;pointer-events:none}
.snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(420px) translateX(20px)}}
@media(prefers-reduced-motion:reduce){.snow i{animation:none;top:auto}}
.wrap{max-width:1180px;margin:auto;padding:clamp(20px,3vw,40px) max(5vw,16px) 120px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,28px);margin-bottom:20px}
.card h2{font-size:22px;margin:0 0 4px;display:flex;gap:10px;align-items:center}
.card h2 b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ice);color:var(--blue);font-size:15px;flex:none}
.hint{color:var(--soft);font-size:14px;margin:0 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0}
.opt span{display:block;height:100%;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);transition:border-color .15s,background .15s}
.opt span strong{display:block;font-family:Mali,sans-serif;font-size:16px}
.opt span small{color:var(--soft);font-size:13px}
.opt input:checked+span{border-color:var(--blue);background:var(--ice)}
.opt input:focus-visible+span{outline:3px solid var(--green);outline-offset:2px}
label.f{display:block;font-weight:500;margin:14px 0 6px}
label.f em{color:#d65a7a;font-style:normal}
input[type=text],input[type=number],textarea{width:100%;font:16px "Noto Sans Thai",sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;min-height:46px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
.num{display:flex;gap:8px;align-items:center}
.num button{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--ice);color:var(--ink);font-size:22px;cursor:pointer}
.num input{text-align:center;font-weight:700;max-width:160px}
.num .u{color:var(--soft)}
.note{background:var(--cream);border-radius:12px;padding:8px 12px;font-size:14px;margin-top:10px;color:var(--soft)}
.hide{display:none!important}
.slip{position:sticky;top:20px;background:var(--card);border:2px dashed var(--blue);border-radius:22px;padding:22px}
.slip h3{margin:0;font-size:18px}
.slip .big{font-size:clamp(40px,5vw,52px);line-height:1.05;color:var(--blue);margin:10px 0 2px;white-space:nowrap}
.slip ul{list-style:none;padding:0;margin:14px 0;font-size:14px;color:var(--soft)}
.slip li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
.slip li b{color:var(--ink);font-weight:500;text-align:right}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:16px;background:var(--green);color:#1f3a0b;font:700 17px Mali,sans-serif;cursor:pointer;box-shadow:0 4px 0 #6d9f3c}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.msg{font-size:13px;margin-top:10px;color:var(--soft);min-height:1em}
.dino{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--green);margin-right:6px}
.bar{display:none}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.slip{position:static}
.bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;justify-content:space-between;align-items:center;gap:12px}
.bar .big{font-size:26px;color:var(--blue)}.bar a{color:var(--blue);font-weight:700;text-decoration:none}}
@media(max-width:600px){.hero-in{grid-template-columns:minmax(0,1fr)}.hero img{width:220px}.hero p{margin-bottom:8px}}
.lang{position:absolute;top:14px;right:max(5vw,16px);z-index:2;display:flex;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);border-radius:99px;padding:3px}
.lang button{min-width:52px;min-height:36px;border:0;border-radius:99px;background:none;color:#fff;font:600 15px Mali,sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#4b58b8}
.lang button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
/* quotation sheet for PDF */
#sheet{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#23285a;font:15px/1.6 "Noto Sans Thai",sans-serif;padding:44px 52px}
#sheet .top{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#6f7fd8,#b9cdfb);border-radius:20px;color:#fff;padding:18px 24px}
#sheet .top img{width:96px;height:96px}
#sheet h1{font:700 30px Mali,sans-serif;margin:0}
#sheet .meta{margin-left:auto;text-align:right;font-size:13px}
#sheet table{width:100%;border-collapse:collapse;margin-top:20px}
#sheet td{padding:9px 6px;border-bottom:1px solid #dfe5f7;vertical-align:top}
#sheet td:first-child{width:190px;color:#5d6496}
#sheet td{white-space:pre-wrap;word-break:break-word}
#sheet .tot{margin-top:22px;background:#eef3ff;border-radius:16px;padding:16px 22px}
#sheet .tot div{display:flex;justify-content:space-between}
#sheet .tot .g{font:700 26px Mali,sans-serif;color:#5867c4;border-top:2px dashed #b9c4ee;margin-top:8px;padding-top:8px}
#sheet .foot{margin-top:22px;font-size:12px;color:#5d6496;text-align:center}
</style>
</head>
<body>
<header class="hero">
  <div class="snow" id="snow"></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="th">ไทย</button><button type="button" data-lang="en">EN</button></div>
  <div class="hero-in">
    <div>
      <span class="tag" data-t="tag"></span>
      <h1>In the Cold Night</h1>

    </div>
    <img src="logo.png" alt="In the Cold Night">
  </div>
</header>

<main class="wrap">
<form id="f" autocomplete="off">
  <section class="card" id="sLang">
    <h2><b>✦</b><span data-t="ficLang"></span></h2>
    <div class="opts"><label class="opt"><input type="radio" name="ficlang" value="ENG" checked><span><strong>ENG</strong></span></label><label class="opt"><input type="radio" name="ficlang" value="ไทย"><span><strong>ไทย</strong></span></label></div>
  </section>
  <section class="card">
    <h2><b>1</b><span data-t="s1"></span></h2>
    <p class="hint" data-t="s1h"></p>
    <div class="opts" id="types"></div>
  </section>

  <section class="card hide" id="sAmount">
    <h2><b>2</b><span id="amtTitle"></span></h2>
    <label class="f" for="qty" id="qtyLabel"></label>
    <div class="num"><button type="button" data-step="-1" aria-label="-">−</button><input type="number" id="qty" inputmode="numeric" min="1"><button type="button" data-step="1" aria-label="+">+</button><span class="u" id="unit"></span></div>
    <div class="note hide" id="minNote"></div>
    <label class="f" data-t="post"></label>
    <div class="opts" id="posts"></div>
  </section>

  <section class="card hide" id="sCover">
    <h2><b>3</b><span data-t="s3"></span></h2>
    <p class="hint" data-t="s3h"></p>
    <div class="opts" id="covers"></div>
    <div id="coverMore" class="hide">
      <label class="f" data-t="artist"></label>
      <div class="opts" id="artists"></div>
      <div id="artistBox"><label class="f" for="artistName" data-t="artistName"></label><input type="text" id="artistName" data-tp="artistNameP"></div>
      <label class="f" for="coverBudget" data-t="budget"></label>
      <input type="number" id="coverBudget" min="0" inputmode="numeric" data-tp="budgetP">
    </div>
  </section>

  <section class="card hide" id="sBrief">
    <h2><b id="briefNo">4</b><span data-t="s4"></span></h2>
    <label class="f" for="cname"><span data-t="cname"></span> <em>*</em></label><input type="text" id="cname" data-tp="cnameP">
    <label class="f" for="contact"><span data-t="contact"></span> <em>*</em></label><input type="text" id="contact" data-tp="contactP">
    <label class="f" for="pair"><span data-t="pair"></span> <em>*</em></label><input type="text" id="pair" data-tp="pairP">
    <label class="f" data-t="ooc"></label>
    <div class="opts" id="oocs"></div>
    <label class="f" for="genre" data-t="genre"></label><input type="text" id="genre" data-tp="genreP">
    <label class="f" for="brief" data-t="brief"></label><textarea id="brief" data-tp="briefP"></textarea>
    <label class="f" data-t="nc"></label>
    <div class="opts" id="ncs"></div>
    <label class="f" for="tw" data-t="tw"></label><textarea id="tw" data-tp="twP"></textarea>
  </section>
</form>

<aside class="slip" id="slip">
  <h3><span class="dino"></span><span data-t="est"></span></h3>
  <div class="big" id="total">฿0</div>
  <div class="hint" id="coverLine"></div>
  <ul id="sum"></ul>
  <button class="btn" id="pdf" type="button" disabled data-t="pdfBtn"></button>
  <div class="msg" id="msg" role="status"></div>
</aside>
</main>

<div class="bar"><div><div class="hint" style="margin:0" data-t="est"></div><div class="big" id="total2">฿0</div></div><a href="#slip" data-t="see"></a></div>

<div id="sheet" aria-hidden="true"></div>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'฿'+n.toLocaleString(t('locale'),{maximumFractionDigits:2});
const mult=x=>` <span style="display:inline;border:0;padding:0;background:none;color:var(--blue)">(${x})</span>`;
const opt=(name,val,label,sub,chk)=>`<label class="opt"><input type="radio" name="${name}" value="${val}"${chk?' checked':''}><span><strong>${label}</strong>${sub?`<small>${sub}</small>`:''}</span></label>`;
const val=n=>(document.querySelector(`input[name=${n}]:checked`)||{}).value;
const ck=(n,v)=>{if(v==null)return;const e=document.querySelector(`input[name=${n}][value="${CSS.escape(v)}"]`);if(e)e.checked=true};
let cur=null;
const subOf=ty=>ty.sub?t(ty.sub):'In ReadAWrite / AO3';
const postsOf=()=>cur.posts||RAW;
function drawOpts(){
  const keep={type:val('type'),post:val('post'),cover:val('cover')||'no',artist:val('artist')||'mine',nc:val('nc')||'nc4',ooc:val('ooc')||'ooc1'};
  $('types').innerHTML=TYPES.map(ty=>opt('type',ty.id,t(ty.name),subOf(ty))).join('');
  $('covers').innerHTML=opt('cover','no',t('coverNo'))+opt('cover','yes',t('coverYes'));
  $('artists').innerHTML=opt('artist','mine',t('artMine'),t('artMineS'))+opt('artist','writer',t('artWriter'),t('artWriterS'));
  $('oocs').innerHTML=opt('ooc','ooc1',t('ooc1'))+opt('ooc','ooc2',t('ooc2'));
  $('ncs').innerHTML=NC.map((n,i)=>opt('nc',n,t(n)+(i<2?mult(t('ncCap')):''))).join('');
  if(cur)$('posts').innerHTML=postsOf().map(p=>opt('post',p[0],t(p[1])+mult('×'+p[2]),p[3]?t(p[3]):'')).join('');
  Object.entries(keep).forEach(([k,v])=>ck(k,v));
  if(cur&&!val('post'))document.querySelector('input[name=post]').checked=true;
}
function applyLang(){
  document.documentElement.lang=lang;
  $('sLang').classList.toggle('hide',lang!=='en');
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  drawOpts();
  if(cur){$('amtTitle').textContent=t(cur.q);$('qtyLabel').textContent=t(cur.q);$('unit').textContent=t(cur.unit);$('minNote').textContent=cur.min?t(cur.min):''}
  render();
}
function setType(id,keepQty){
  cur=TYPES.find(ty=>ty.id===id);if(!cur)return;
  $('posts').innerHTML='';drawOpts();
  $('amtTitle').textContent=t(cur.q);$('qtyLabel').textContent=t(cur.q);$('unit').textContent=t(cur.unit);
  if(!keepQty)$('qty').value=cur.def;$('qty').step=cur.step;
  $('minNote').textContent=cur.min?t(cur.min):'';$('minNote').classList.toggle('hide',!cur.min);
  const raw=cur.id!=='tw';$('sCover').classList.toggle('hide',!raw);$('briefNo').textContent=raw?4:3;
  ['sAmount','sBrief'].forEach(s=>$(s).classList.remove('hide'));
}
function postInfo(){const ps=postsOf();return ps.find(p=>p[0]===val('post'))||ps[0]}
function calc(){
  if(!cur)return null;
  const q=Math.max(0,Math.floor(+$('qty').value||0));const p=postInfo();
  let fee=Math.ceil(cur.price(q)*p[2]);
  if(val('nc')==='nc1'||val('nc')==='nc2')fee+=Math.min(100,Math.ceil(fee*0.5));
  const cover=cur.id!=='tw'&&val('cover')==='yes';
  const budget=cover?Math.max(0,+$('coverBudget').value||0):0;
  return {q,p,fee,cover,budget,total:fee+budget};
}
function render(){
  $('coverMore').classList.toggle('hide',val('cover')!=='yes');
  $('artistBox').classList.toggle('hide',val('artist')!=='mine');
  const r=calc();
  if(!r){$('msg').textContent=t('mPick');return}
  $('total').textContent=$('total2').textContent=fmt(r.total);
  $('coverLine').textContent=r.cover?`${t('fee')} ${fmt(r.fee)} + ${t('coverBudget')} ${fmt(r.budget)}`:'';
  const items=[[t('kType'),t(cur.name)+(cur.id==='tw'?'':' · ReadAWrite / AO3')],[t(cur.q),r.q.toLocaleString(t('locale'))+' '+t(cur.unit)],[t('kPost'),t(r.p[1])]];
  if(r.cover)items.push([t('kCover'),val('artist')==='mine'?t('artMine'):t('artWriter')]);
  $('sum').innerHTML=items.map(i=>`<li><span>${esc(i[0])}</span><b>${esc(i[1])}</b></li>`).join('');
  const miss=['cname','contact','pair'].filter(k=>!$(k).value.trim()).map(t);
  $('pdf').disabled=!(r.q>0&&!miss.length);
  $('msg').textContent=r.q<=0?t('mQty'):miss.length?t('mMiss')+miss.join(', '):t('mReady');
  save();
}
const FIELDS=['qty','coverBudget','artistName','cname','contact','pair','genre','brief','tw'];
function save(){try{const d={type:val('type'),post:val('post'),cover:val('cover'),artist:val('artist'),nc:val('nc'),ooc:val('ooc'),ficlang:val('ficlang')};FIELDS.forEach(k=>d[k]=$(k).value);localStorage.setItem('itcn-q2',JSON.stringify(d))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('itcn-q2')||'null');if(!d||!d.type)return;
  ck('type',d.type);FIELDS.forEach(k=>{if(d[k]!=null)$(k).value=d[k]});setType(d.type,true);['post','cover','artist','nc','ooc','ficlang'].forEach(n=>ck(n,d[n]))}catch(e){}}
$('f').addEventListener('change',e=>{if(e.target.name==='type')setType(e.target.value);render()});
$('f').addEventListener('input',render);
$('f').addEventListener('submit',e=>e.preventDefault());
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{if(!cur)return;$('qty').value=Math.max(0,(+$('qty').value||0)+cur.step*+b.dataset.step);render()}));
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('itcn-lang',lang)}catch(e){}applyLang()}));
drawOpts();load();applyLang();
$('snow').innerHTML=Array.from({length:26},(_,i)=>`<i style="left:${(i*37)%100}%;animation-duration:${6+(i%5)*2}s;animation-delay:-${i%9}s;transform:scale(${.5+(i%3)*.3})"></i>`).join('');
let dl=null;
(async()=>{try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){dl=null}})();
function buildSheet(r){
  const now=new Date();const no='ITCN-'+now.toISOString().slice(2,10).replace(/-/g,'')+'-'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
  const rows=[...(lang==='en'?[[t('qFicLang'),val('ficlang')]]:[]),[t('cname'),$('cname').value],[t('contact'),$('contact').value],[t('kType'),t(cur.name)+(cur.id==='tw'?'':' (ReadAWrite / AO3)')],
    [t(cur.q),r.q.toLocaleString(t('locale'))+' '+t(cur.unit)+(cur.min?'\n('+t(cur.min)+')':'')],[t('kPost'),t(r.p[1])+(r.p[0]==='quiet'?t('qDocx'):'')],
    [t('pair'),$('pair').value],[t('ooc'),t(val('ooc'))],[t('qGenre'),$('genre').value||'-'],[t('qBrief'),$('brief').value||'-'],[t('nc'),t(val('nc'))],[t('qTw'),$('tw').value||'-']];
  if(cur.id!=='tw')rows.push([t('kCover'),r.cover?(val('artist')==='mine'?t('qMine')+($('artistName').value||'-'):t('qWriter'))+'\n'+t('qBudget')+fmt(r.budget):t('qNoCover')]);
  $('sheet').innerHTML=`<div class="top"><img src="logo.png" alt=""><div><h1>In the Cold Night</h1><div>${esc(t('qTitle'))}</div></div><div class="meta">${esc(t('qNo'))} ${esc(no)}<br>${esc(t('qDate'))} ${esc(now.toLocaleDateString(t('locale'),{dateStyle:'long'}))}</div></div>
  <table>${rows.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</table>
  <div class="tot">${r.cover?`<div><span>${esc(t('qFee'))}</span><span>${fmt(r.fee)}</span></div><div><span>${esc(t('budget'))}</span><span>${fmt(r.budget)}</span></div>`:''}<div class="g"><span>${esc(t('qTotal'))}</span><span>${fmt(r.total)}</span></div></div>
  <div class="foot">${esc(t('qFoot'))}</div>`;
  return no;
}
$('pdf').addEventListener('click',async()=>{
  const r=calc();if(!r)return;const btn=$('pdf');
  if(!window.html2canvas||!window.jspdf){$('msg').textContent=t('mLib');return}
  btn.disabled=true;$('msg').textContent=t('mMaking');
  try{
    const no=buildSheet(r);await document.fonts.ready;
    const cv=await html2canvas($('sheet'),{scale:2,backgroundColor:'#ffffff'});
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const pxPerPage=Math.floor(cv.width*ph/pw);let y=0,first=true;
    while(y<cv.height){const h=Math.min(pxPerPage,cv.height-y);const c=document.createElement('canvas');c.width=cv.width;c.height=h;
      c.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(!first)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,h*pw/cv.width);first=false;y+=h}
    const fname=`${t('file')}-InTheColdNight-${no}.pdf`;
    if(!window.claude){pdf.save(fname);$('msg').textContent=t('mSaved');return}
    if(!dl){$('msg').textContent=t('mNoDl');return}
    await dl.save({filename:fname,data:pdf.output('blob')});
    $('msg').textContent=t('mSaved');
  }catch(e){$('msg').textContent=e&&e.code==='declined'?t('mDecl'):t('mFail')}
  finally{btn.disabled=false}
});
}
</script>
</body>
</html>
